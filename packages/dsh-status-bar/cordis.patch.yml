# dsh-status-bar-plugin bundle patch
#
# This is the `dsh.bundle.patch` layer of the local bundle package. When the
# package is declared in a profile's dependencies, adding it to
# `dsh.profile.bundles` mounts the row below at boot. The row resolves
# `dsh-status-bar-plugin` from the profile's node_modules, where the `link:`
# dependency points back at this directory.
- insert:
    - id: dsh-status-bar-plugin
      name: 'dsh-status-bar-plugin'
      config:
        autoLaunch: true
