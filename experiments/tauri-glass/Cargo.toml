[package]
name = "dsh-glass-native-compare"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "=0.62.2"
windows-numerics = "0.3.1"
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Numerics", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D_Common", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 2
